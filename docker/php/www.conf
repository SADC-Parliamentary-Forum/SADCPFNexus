; Override PHP-FPM pool defaults.
; By default PHP-FPM strips all environment variables from worker processes
; (clear_env = yes), which prevents Docker env vars (FRONTEND_URL, APP_ENV,
; APP_DEBUG, etc.) from reaching Laravel's env() function.
; Setting clear_env = no passes all container environment variables through.
[www]
clear_env = no

; Recycle each worker after N requests. Without this (default: 0/unlimited),
; a worker that somehow enters a bad state (leaked connection, corrupted
; opcache entry, memory growth) never self-heals — it just keeps serving
; broken responses indefinitely until someone notices and restarts the
; container manually. This bounds the blast radius of any single worker
; going bad to at most 500 requests, and is a standard production safety
; net independent of what's actually causing any given incident.
pm.max_requests = 500
