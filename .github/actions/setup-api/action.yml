name: Set up API (PHP + Composer)
description: >
  Shared PHP toolchain, Composer cache and dependency install for API jobs.
  Each job keeps its own test/lint/audit steps so failures stay visible per job.

inputs:
  php-version:
    description: PHP version
    default: '8.4'
  extensions:
    description: PHP extensions for shivammathur/setup-php
    default: mbstring, xml, ctype, json
  cache-key-prefix:
    description: Composer cache key prefix (keeps per-job caches separate)
    default: composer
  cache:
    description: Restore/save the vendor cache
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up PHP ${{ inputs.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        coverage: none

    - name: Cache Composer packages
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: api/vendor
        key: ${{ inputs.cache-key-prefix }}-${{ inputs.php-version }}-${{ hashFiles('api/composer.lock') }}
        restore-keys: ${{ inputs.cache-key-prefix }}-${{ inputs.php-version }}-

    - name: Install dependencies
      shell: bash
      working-directory: api
      run: composer install --no-interaction --prefer-dist --optimize-autoloader
