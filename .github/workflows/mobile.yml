name: Mobile — Flutter Tests & Store Artifacts

# Default PR/main builds produce artifacts only.
# Store submission jobs are gated by repository variables + secrets and never invent signing keys.
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      submit_play:
        description: 'Submit Android AAB to Play Store (requires PLAY_SUBMIT_ENABLED + secrets)'
        type: boolean
        default: false
      submit_appstore:
        description: 'Upload iOS build to TestFlight (requires APPSTORE_SUBMIT_ENABLED + secrets)'
        type: boolean
        default: false

# Required GitHub secrets for store submission (never commit these):
#   Android / Play:
#     PLAY_STORE_JSON          — Google Play service-account JSON
#     PLAY_PACKAGE_NAME        — applicationId / package name
#     ANDROID_KEYSTORE_BASE64  — base64-encoded release keystore
#     SADC_KEYSTORE_PASSWORD, SADC_KEY_ALIAS, SADC_KEY_PASSWORD
#   iOS / App Store Connect:
#     APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_API_ISSUER_ID,
#     APP_STORE_CONNECT_API_KEY_P8 (contents of .p8), IOS_BUNDLE_ID
# Repository variables (gates):
#   PLAY_SUBMIT_ENABLED=true, APPSTORE_SUBMIT_ENABLED=true, IOS_BUILD_ENABLED=true

jobs:
  test:
    name: Flutter analyze & test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generator (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (dart analyze)
        run: flutter analyze --no-fatal-infos

      - name: Run widget tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage
          path: mobile/coverage/
          retention-days: 7

  build-android:
    name: Build Android APK + AAB (debug)
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generator
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Build App Bundle (debug)
        run: flutter build appbundle --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab-${{ github.sha }}
          path: mobile/build/app/outputs/bundle/debug/app-debug.aab
          retention-days: 14

  # iOS store builds require macOS runners. Disabled by default — enable via repo variable IOS_BUILD_ENABLED=true.
  build-ios:
    name: Build iOS (macOS — optional)
    if: ${{ vars.IOS_BUILD_ENABLED == 'true' }}
    runs-on: macos-latest
    needs: test

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generator
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign

      - name: Note
        run: echo "iOS artifact is unsigned; store submission remains gated on APPSTORE_SUBMIT_ENABLED + ASC secrets."

  submit-play:
    name: Submit Android to Play Store (gated)
    # Secrets cannot be used in job-level `if`; gate on vars + dispatch, then skip inside if secrets missing.
    if: >
      ${{
        vars.PLAY_SUBMIT_ENABLED == 'true' &&
        (github.event_name == 'workflow_dispatch' && inputs.submit_play == true ||
         github.ref == 'refs/heads/main' && github.event_name == 'push')
      }}
    runs-on: ubuntu-latest
    needs: [test]
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Require Play Store secrets
        env:
          PLAY_STORE_JSON: ${{ secrets.PLAY_STORE_JSON }}
          PLAY_PACKAGE_NAME: ${{ secrets.PLAY_PACKAGE_NAME }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PLAY_STORE_JSON" ] || [ -z "$PLAY_PACKAGE_NAME" ] || [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Play Store secrets absent — conditional skip (no submission)."
            echo "SKIP_SUBMIT=1" >> "$GITHUB_ENV"
          else
            echo "SKIP_SUBMIT=0" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP_SUBMIT == '0'

      - name: Set up Java
        if: env.SKIP_SUBMIT == '0'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        if: env.SKIP_SUBMIT == '0'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Decode keystore
        if: env.SKIP_SUBMIT == '0'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.SADC_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.SADC_KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.SADC_KEY_PASSWORD }}" >> android/key.properties

      - name: Get dependencies
        if: env.SKIP_SUBMIT == '0'
        run: flutter pub get

      - name: Build release AAB
        if: env.SKIP_SUBMIT == '0'
        run: flutter build appbundle --release

      - name: Upload to Play Store (internal track)
        if: env.SKIP_SUBMIT == '0'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON }}
          packageName: ${{ secrets.PLAY_PACKAGE_NAME }}
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

  submit-appstore:
    name: Submit iOS to TestFlight (gated)
    if: >
      ${{
        vars.IOS_BUILD_ENABLED == 'true' &&
        vars.APPSTORE_SUBMIT_ENABLED == 'true' &&
        (github.event_name == 'workflow_dispatch' && inputs.submit_appstore == true ||
         github.ref == 'refs/heads/main' && github.event_name == 'push')
      }}
    runs-on: macos-latest
    needs: [test]
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Require App Store Connect secrets
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_API_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_P8" ]; then
            echo "App Store Connect secrets absent — conditional skip (no submission)."
            echo "SKIP_SUBMIT=1" >> "$GITHUB_ENV"
          else
            echo "SKIP_SUBMIT=0" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP_SUBMIT == '0'

      - name: Set up Flutter
        if: env.SKIP_SUBMIT == '0'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        if: env.SKIP_SUBMIT == '0'
        run: flutter pub get

      - name: Write App Store Connect API key
        if: env.SKIP_SUBMIT == '0'
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY" > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: Build iOS IPA
        if: env.SKIP_SUBMIT == '0'
        run: |
          flutter build ipa --release || {
            echo "IPA build skipped/failed — ensure signing certs are provisioned on the macOS runner."
            echo "SKIP_UPLOAD=1" >> "$GITHUB_ENV"
            exit 0
          }

      - name: Upload to TestFlight (skip if IPA missing)
        if: env.SKIP_SUBMIT == '0' && env.SKIP_UPLOAD != '1'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          IPA=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -n 1 || true)
          if [ -z "$IPA" ]; then
            echo "No IPA produced — conditional skip (secrets/signing incomplete)."
            exit 0
          fi
          xcrun altool --upload-app --type ios -f "$IPA" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
