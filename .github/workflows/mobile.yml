name: Mobile — Flutter Tests & Store Artifacts

# Builds Android APK/AAB artifacts for PR/main. Does NOT submit to Play Store or App Store.
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

jobs:
  test:
    name: Flutter analyze & test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generator (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (dart analyze)
        run: flutter analyze --no-fatal-infos

      - name: Run widget tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage
          path: mobile/coverage/
          retention-days: 7

  build-android:
    name: Build Android APK + AAB (debug)
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generator
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Build App Bundle (debug)
        run: flutter build appbundle --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab-${{ github.sha }}
          path: mobile/build/app/outputs/bundle/debug/app-debug.aab
          retention-days: 14

  # iOS store builds require macOS runners. Disabled by default — enable via repo variable IOS_BUILD_ENABLED=true.
  build-ios:
    name: Build iOS (macOS — optional)
    if: ${{ vars.IOS_BUILD_ENABLED == 'true' }}
    runs-on: macos-latest
    needs: test

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generator
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign

      - name: Note
        run: echo "iOS artifact is unsigned; store submission is out of scope for CI."
