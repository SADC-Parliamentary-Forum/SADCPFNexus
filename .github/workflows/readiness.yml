name: Production Readiness Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'web/**'
      - 'scripts/readiness/**'
      - 'run-tests.sh'
      - '.github/workflows/readiness.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'web/**'
      - 'scripts/readiness/**'
      - 'run-tests.sh'
      - '.github/workflows/readiness.yml'

jobs:
  readiness:
    name: Readiness
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sadcpfnexus
          POSTGRES_USER: sadcpf
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pgsql, bcmath, mbstring, xml, ctype, json
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install chromium --with-deps

      - name: Migrate and seed database
        working-directory: api
        env:
          APP_ENV: local
          APP_KEY: base64:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa=
          APP_URL: http://localhost:8000
          FRONTEND_URL: http://localhost:3000
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: sadcpfnexus
          DB_USERNAME: sadcpf
          DB_PASSWORD: secret
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: database
          MAIL_MAILER: array
          BCRYPT_ROUNDS: '4'
        run: |
          test -f .env || cp .env.example .env
          php artisan migrate:fresh --seed --force

      - name: Start API
        working-directory: api
        env:
          APP_ENV: local
          APP_KEY: base64:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa=
          APP_URL: http://localhost:8000
          FRONTEND_URL: http://localhost:3000
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: sadcpfnexus
          DB_USERNAME: sadcpf
          DB_PASSWORD: secret
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: database
          MAIL_MAILER: array
          BCRYPT_ROUNDS: '4'
        run: php artisan serve --port=8000 &

      - name: Build and start web
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          PORT: 3000
        run: |
          npm run build
          npm start &

      - name: Wait for services
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8000/up && break || sleep 1; done
          for i in $(seq 1 60); do curl -sf http://localhost:3000 && break || sleep 1; done

      - name: Run readiness gate
        run: bash scripts/readiness/run-readiness.sh

      - name: Upload readiness artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-artifacts
          path: artifacts/
          retention-days: 14
