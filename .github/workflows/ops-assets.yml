# Manual asset-register data fixes on production.
# Runs an artisan command inside the deployed PHP container over the deploy SSH key.
name: Ops - asset data

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task to run
        type: choice
        options:
          - backfill-locations-dry-run
          - backfill-locations-apply
          - app-errors
          - mfa-check
          - mfa-reset-user-17
          - log-diag
          - log-tail
      tenant:
        description: Tenant id (blank = the only tenant)
        required: false
        default: ''

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  run:
    name: ${{ github.event.inputs.task }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - name: Run task over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          TASK: ${{ github.event.inputs.task }}
          TENANT: ${{ github.event.inputs.tenant }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}" || { echo "Missing secret DEPLOY_SSH_PRIVATE_KEY"; exit 1; }
          [[ "$TENANT" =~ ^[0-9]*$ ]] || { echo "Tenant must be a number"; exit 1; }
          APP=/home/sadcpf-nexus/htdocs/nexus.sadcpf.org/app
          ARGS=""
          if [ -n "$TENANT" ]; then ARGS="--tenant=$TENANT"; fi
          case "$TASK" in
            backfill-locations-dry-run) CMD="docker exec sadcpf_php php artisan assets:backfill-locations $ARGS" ;;
            backfill-locations-apply)   CMD="bash scripts/ops/backup.sh && docker exec sadcpf_php php artisan assets:backfill-locations $ARGS --apply" ;;
            # Read-only: last error entries (first line of each, truncated) from the Laravel log.
            app-errors) CMD="for c in sadcpf_php sadcpf_nginx sadcpf_web; do echo \"== \$c\"; docker logs --since 12h \$c 2>&1 | grep -iE 'error|exception| 500 |auth/login' | tail -n 25 | cut -c1-500; done" ;;
            # Read-only: per MFA user, whether the stored secret decrypts and verifies (never prints it).
            mfa-check) CMD="echo  | base64 -d | docker exec -i sadcpf_php php" ;;
            # One-off: the admin MFA reset (clear secret, revoke sessions, audit, notify) for user 17.
            mfa-reset-user-17) CMD="echo  | base64 -d | docker exec -i sadcpf_php php" ;;
            # Read-only (writes one marker line): where Laravel logs go and whether it can write there.
            log-diag) CMD="echo  | base64 -d | docker exec -i sadcpf_php php; docker exec sadcpf_php sh -c 'id; ps -o user,comm | head -5'" ;;
            # Read-only: entry headers (first line, truncated) from the last 3 daily Laravel logs.
            log-tail) CMD="docker exec sadcpf_php sh -c 'for f in \$(ls -1 /var/www/api/storage/logs/laravel-*.log | tail -n 3); do echo == \$f; grep -E \"^\[20\" \$f | cut -c1-300 | tail -n 40; done'" ;;
            *) echo "Unknown task: $TASK"; exit 1 ;;
          esac
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H 194.163.156.4 >> "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            sadcpf-nexus@194.163.156.4 \
            "cd $APP && $CMD"
          rm -f "$HOME/.ssh/id_ed25519"
