# Manual asset-register data fixes and read-only diagnostics on production.
# Runs an artisan command inside the deployed PHP container over the deploy SSH key.
name: Ops - asset data

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task to run
        type: choice
        options:
          - backfill-locations-dry-run
          - backfill-locations-apply
          - backfill-identifiers-dry-run
          - backfill-identifiers-apply
          - infer-assignees-dry-run
          - infer-assignees-apply
          - staff-lookup
          - invite-staff
          - app-errors
          - mfa-check
          - log-tail
          - log-perms
          - roles-cleanup-dry-run
          - roles-cleanup-apply
      tenant:
        description: Tenant id (blank = the only tenant)
        required: false
        default: ''

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  run:
    name: ${{ github.event.inputs.task }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - name: Run task over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          TASK: ${{ github.event.inputs.task }}
          TENANT: ${{ github.event.inputs.tenant }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}" || { echo "Missing secret DEPLOY_SSH_PRIVATE_KEY"; exit 1; }
          [[ "$TENANT" =~ ^[0-9]*$ ]] || { echo "Tenant must be a number"; exit 1; }
          APP=/home/sadcpf-nexus/htdocs/nexus.sadcpf.org/app
          ARGS=""
          if [ -n "$TENANT" ]; then ARGS="--tenant=$TENANT"; fi
          case "$TASK" in
            backfill-locations-dry-run) CMD="docker exec sadcpf_php php artisan assets:backfill-locations $ARGS" ;;
            backfill-locations-apply)   CMD="bash scripts/ops/backup.sh && docker exec sadcpf_php php artisan assets:backfill-locations $ARGS --apply" ;;
            backfill-identifiers-dry-run) CMD="docker exec sadcpf_php php artisan assets:backfill-identifiers $ARGS" ;;
            backfill-identifiers-apply)   CMD="bash scripts/ops/backup.sh && docker exec sadcpf_php php artisan assets:backfill-identifiers $ARGS --apply" ;;
            # Assign unassigned assets to the staff member named by a code in their name or location.
            infer-assignees-dry-run) CMD="docker exec sadcpf_php php artisan assets:infer-assignees $ARGS" ;;
            infer-assignees-apply)   CMD="bash scripts/ops/backup.sh && docker exec sadcpf_php php artisan assets:infer-assignees $ARGS --apply" ;;
            # Read-only: accounts and staff-directory emails for named people.
            staff-lookup) CMD="echo  | base64 -d | docker exec -i sadcpf_php php" ;;
            # Create the Forum-confirmed staff accounts and send/resend their invitations (10 Nov 2026).
            invite-staff) CMD="echo  | base64 -d | docker exec -i sadcpf_php php" ;;
            # Read-only: error-looking lines from the last 12h of container output.
            app-errors) CMD="for c in sadcpf_php sadcpf_nginx sadcpf_web; do echo \"== \$c\"; docker logs --since 12h \$c 2>&1 | grep -iE 'error|exception| 500 |auth/login' | tail -n 25 | cut -c1-500; done" ;;
            # Read-only: per MFA user, whether the stored secret decrypts and verifies (never prints it).
            mfa-check) CMD="echo  | base64 -d | docker exec -i sadcpf_php php" ;;
            # Read-only: entry headers (first line, truncated) from the last 3 daily Laravel logs.
            log-tail) CMD="docker exec sadcpf_php sh -c 'for f in \$(ls -1 /var/www/api/storage/logs/laravel-*.log | tail -n 3); do echo == \$f; grep -E \"^\[20\" \$f | cut -c1-300 | tail -n 40; done'" ;;
            # Read-only: log file ownership, and whether the php-fpm user (www-data) can write each one.
            log-perms) CMD="docker exec sadcpf_php ls -ln /var/www/api/storage/logs; docker exec -u www-data sadcpf_php sh -c 'for f in /var/www/api/storage/logs/*.log; do [ -w \"\$f\" ] && echo \"w  \$f\" || echo \"RO \$f\"; done'; docker exec sadcpf_php sh -c 'grep -rn umask /usr/local/etc/php-fpm.d 2>/dev/null; crontab -l 2>/dev/null | head'" ;;
            # Move users off old role names onto the role catalogue and delete unused duplicate roles.
            roles-cleanup-dry-run) CMD="docker exec sadcpf_php php artisan roles:cleanup" ;;
            roles-cleanup-apply)   CMD="bash scripts/ops/backup.sh && docker exec sadcpf_php php artisan roles:cleanup --apply" ;;
            *) echo "Unknown task: $TASK"; exit 1 ;;
          esac
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H 194.163.156.4 >> "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            sadcpf-nexus@194.163.156.4 \
            "cd $APP && $CMD"
          rm -f "$HOME/.ssh/id_ed25519"
