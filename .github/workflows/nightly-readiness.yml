name: Nightly Readiness Regression

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  readiness-nightly:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sadcpfnexus
          POSTGRES_USER: sadcpf
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pgsql, bcmath, mbstring, xml, ctype, json
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install chromium --with-deps

      - name: Migrate and seed database
        working-directory: api
        env:
          APP_ENV: local
          APP_KEY: base64:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa=
          APP_URL: http://localhost:8000
          FRONTEND_URL: http://localhost:3000
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: sadcpfnexus
          DB_USERNAME: sadcpf
          DB_PASSWORD: secret
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: database
          MAIL_MAILER: array
          BCRYPT_ROUNDS: '4'
        run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env
          php artisan migrate:fresh --seed --force
          php -r '
            $pdo = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=sadcpfnexus", "sadcpf", "secret");
            $exists = $pdo->query("SELECT 1 FROM pg_database WHERE datname = '\''sadcpfnexus_test'\''")->fetchColumn();
            if (!$exists) {
                $pdo->exec("CREATE DATABASE sadcpfnexus_test");
            }
          '

      - name: Start API
        working-directory: api
        env:
          APP_ENV: local
          APP_KEY: base64:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa=
          APP_URL: http://localhost:8000
          FRONTEND_URL: http://localhost:3000
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: sadcpfnexus
          DB_USERNAME: sadcpf
          DB_PASSWORD: secret
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: database
          MAIL_MAILER: array
          BCRYPT_ROUNDS: '4'
        run: php artisan serve --port=8000 &

      - name: Build and start web
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          PORT: 3000
        run: |
          npm run build
          npm start &

      - name: Wait for services
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8000/up && break || sleep 1; done
          for i in $(seq 1 60); do curl -sf http://localhost:3000 && break || sleep 1; done

      - name: Run full readiness
        env:
          APP_ENV: testing
          APP_KEY: base64:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: sadcpfnexus_test
          DB_USERNAME: sadcpf
          DB_PASSWORD: secret
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          MAIL_MAILER: array
          BCRYPT_ROUNDS: '4'
          REQUIRE_PRIVILEGED_MFA: 'false'
          SENTRY_LARAVEL_DSN: ''
        run: bash scripts/readiness/run-readiness.sh

      - name: Upload readiness artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-readiness-artifacts
          path: artifacts/
          retention-days: 21
