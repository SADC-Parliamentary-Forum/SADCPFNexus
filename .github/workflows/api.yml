name: API — PHPUnit Tests

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'

jobs:
  test:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Production Docker (`docker/php/Dockerfile`) and composer.lock require PHP 8.4
        # (openspout ~8.4, symfony/filesystem >=8.4.1). 8.2/8.3 cannot install the lockfile.
        php: ['8.4']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sadcpfnexus_test
          POSTGRES_USER: sadcpf
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_pgsql, pgsql, bcmath, mbstring, xml, ctype, json
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env.testing
        run: cp .env.testing.example .env.testing

      - name: Run PHPUnit tests
        run: php artisan test --stop-on-failure
        env:
          APP_ENV: testing
          APP_KEY: base64:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: sadcpfnexus_test
          DB_USERNAME: sadcpf
          DB_PASSWORD: secret
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          MAIL_MAILER: array
          BCRYPT_ROUNDS: '4'
          REQUIRE_PRIVILEGED_MFA: 'false'
          SENTRY_LARAVEL_DSN: ''

  lint:
    name: Laravel Pint (code style)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-lint-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-lint-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # The tree was never Pint-clean (hundreds of historical migrations/tests).
      # Fail the PR only when this branch's PHP files diverge from origin/main.
      - name: Run Pint on PHP files changed vs base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}" --depth=1
            BASE="origin/${{ github.base_ref }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            else
              BASE="${BEFORE}"
            fi
          fi
          mapfile -t files < <(git -C "${GITHUB_WORKSPACE}" diff --name-only --diff-filter=ACMR "${BASE}...HEAD" -- 'api/**/*.php' | sed 's|^api/||' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files changed vs ${BASE}"
            exit 0
          fi
          echo "Pint checking ${#files[@]} file(s) vs ${BASE}"
          printf '%s\n' "${files[@]}"
          ./vendor/bin/pint --test "${files[@]}"

  security:
    name: Composer security audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Audit for vulnerabilities
        run: composer audit
