name: Security Scan

# Dependency vulnerability audit (Composer + npm) and static analysis (Semgrep + CodeQL).
# Separate from gitleaks.yml (secret scanning) and readiness.yml (functional/E2E gates).
#
# Blocking behaviour (fails the check run → blocks production deploy via deploy-production.yml's
# CI gate, since it waits on every check run for the commit):
#   - Composer/npm dependency audit: BLOCKS on high/critical severity advisories only.
#   - Semgrep SAST: BLOCKS on ERROR-severity findings only.
#   - CodeQL: informational only (uploaded to the Security tab, never fails this workflow).
# Lower-severity findings from all tools are still uploaded to the Security tab for visibility.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # weekly Monday 03:00 UTC, catches newly disclosed advisories on unchanged code
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: Dependency audit (Composer + npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Composer audit (report)
        working-directory: api
        continue-on-error: true
        run: composer audit --format=json | tee ../composer-audit.json

      - name: Composer audit gate (high/critical only)
        working-directory: api
        run: |
          if [ ! -s ../composer-audit.json ]; then
            echo "No composer audit output captured — treating as pass."
            exit 0
          fi
          count=$(jq '[.advisories // {} | to_entries[].value[] | select(.severity == "high" or .severity == "critical")] | length' ../composer-audit.json)
          echo "High/critical Composer advisories: $count"
          if [ "$count" -gt 0 ]; then
            jq -r '.advisories // {} | to_entries[].value[] | select(.severity == "high" or .severity == "critical") | "  [\(.severity)] \(.packageName): \(.title) (\(.cve // .advisoryId))"' ../composer-audit.json
            exit 1
          fi

      - name: npm audit (high/critical gate)
        working-directory: web
        run: npm audit --audit-level=high

      - name: Upload dependency audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: composer-audit.json
          retention-days: 30

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: python3 -m pip install --quiet semgrep

      - name: Semgrep full scan (report, all severities)
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --sarif --output semgrep.sarif \
            api web

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      - name: Semgrep gate (ERROR severity only)
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --severity ERROR \
            --error \
            api web

  codeql:
    name: CodeQL (JavaScript/TypeScript, informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
